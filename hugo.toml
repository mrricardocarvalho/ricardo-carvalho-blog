baseURL = "https://mrricardocarvalho.github.io/ricardo-carvalho-blog/"
languageCode = "en-us"
title = "Ricardo Carvalho"
theme = "PaperMod"
paginate = 10

[params]
  description = "Business Central development: the parts the release notes don't tell you."
  author = "Ricardo Carvalho"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowRssButton = true
  displayFullLangName = true

  [params.homeInfoParams]
    Title = "Business Central, without the marketing."
    Content = "The uncomfortable truth about Dynamics 365 Business Central development: NAV-to-BC migrations, AL, integrations and Azure DevOps, written from production scars instead of release notes. Real issues, real fixes, links to the sources."

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/ricardo-carvalho-bc/"

  [[params.socialIcons]]
    name = "RSS"
    url = "index.xml"

[params.assets]
  favicon = "favicon.svg"

[markup.highlight]
  style = "dracula"
  lineNos = false
  codeFences = true

[markup.goldmark.renderer]
  unsafe = true

[outputs]
  home = ["HTML", "RSS"]

[taxonomies]
  tag = "tags"
